version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: deeper-research-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-deeperresearch}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - deeper-research-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "27017:27017"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: deeper-research-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:changeme@mongodb:27017/deeperresearch?authSource=admin}
      AI_PROVIDER: ${AI_PROVIDER:-venice}
      VENICE_API_KEY: ${VENICE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANONYMOUS_MODE: ${ANONYMOUS_MODE:-true}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-off}
      ENABLE_WEB_CITATIONS: ${ENABLE_WEB_CITATIONS:-false}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-32000}
      TOP_P: ${TOP_P:-0.95}
      TOP_K: ${TOP_K:-40}
      FRAMEWORKS_PATH: ${FRAMEWORKS_PATH:-./data/frameworks}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - deeper-research-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: deeper-research-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deeper-research-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    ports:
      - "8080:8080"

networks:
  deeper-research-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
