name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]  # drop 14/16 (EOL)
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test --ignore-scripts
        env:
          CI: "true"

      - name: Upload test reports
        if: always() && (hashFiles('**/coverage/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.node }}
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  test-frontend:
    name: Frontend Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: []
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --ignore-scripts
        env:
          CI: "true"

      - name: Upload test reports
        if: always() && (hashFiles('**/coverage/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node }}
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7
