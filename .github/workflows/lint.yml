name: Code Quality & Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    name: Backend Linting (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint 2>&1 | tee eslint-output.txt
        continue-on-error: true

      - name: Comment on PR with lint results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('backend/eslint-output.txt', 'utf8');
            if (output.includes('error')) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⚠️ **ESLint Issues Found**\n```\n' + output.substring(0, 3000) + '\n```'
              });
            }
        continue-on-error: true

  lint-frontend:
    name: Frontend Linting (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint 2>&1 | tee eslint-output.txt
        continue-on-error: true

  format-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm install -g prettier

      - name: Check code formatting
        run: |
          prettier --check backend/src frontend/src 2>&1 | tee prettier-output.txt || true
        continue-on-error: true

      - name: Comment on PR with format issues
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const output = fs.readFileSync('prettier-output.txt', 'utf8');
              if (output.length > 0) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: '💅 **Code Formatting Issues**\nRun `prettier --write .` to fix\n```\n' + output.substring(0, 2000) + '\n```'
                });
              }
            } catch (e) {
              console.log('No format issues found');
            }
        continue-on-error: true

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: docs/ *.md
          config_file: '.markdownlint.json'
        continue-on-error: true

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: karanvdan/yamllint-github-action@master
        with:
          yamllint_config_file: '.yamllint.yml'
        continue-on-error: true

  json-lint:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null 2>&1 || echo "❌ Invalid JSON: $file"
          done
        continue-on-error: true

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v1
        with:
          files: '**/*.{md,ts,tsx,js,jsx,json}'
          config: 'cspell.json'
        continue-on-error: true

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run TypeScript check
        run: |
          if [ -f backend/tsconfig.json ]; then
            cd backend && npx tsc --noEmit || true
          fi
          if [ -f frontend/tsconfig.json ]; then
            cd frontend && npx tsc --noEmit || true
          fi
        continue-on-error: true

  quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, format-check, markdown-lint]
    if: always()
    steps:
      - name: Report code quality status
        run: |
          echo "=== Code Quality Check Results ==="
          echo "✅ Backend Linting: ${{ needs.lint-backend.result }}"
          echo "✅ Frontend Linting: ${{ needs.lint-frontend.result }}"
          echo "✅ Format Check: ${{ needs.format-check.result }}"
          echo "✅ Markdown Lint: ${{ needs.markdown-lint.result }}"
          echo ""
          echo "For details, check the Actions tab"
