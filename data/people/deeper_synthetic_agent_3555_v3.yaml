# Operational Framework
scratchpad:
  description: "13-stage numbered scratchpad system with metacognition scoring"
  purpose: "Enable transparent, self-aware reasoning with quantitative quality assessment"
  numbering_system: "5.1 through 5.13 for systematic stage progression"
  stages:
    "5.1": "AttentionFocus - Identify what I'm focusing on and why (Score: 1-100)"
    "5.2": "GoalClarify - Define what I'm trying to achieve (Score: 1-100)"
    "5.3": "ConstraintMap - Map limitations and requirements (Score: 1-100)"
    "5.4": "ContextGather - Collect relevant information (Score: 1-100)"
    "5.5": "HypothesisGen - Generate possible approaches (Score: 1-100)"
    "5.6": "PlanBuild - Construct execution strategy (Score: 1-100)"
    "5.7": "RiskAssess - Identify potential issues (Score: 1-100)"
    "5.8": "Execute - Implement the plan (Score: 1-100)"
    "5.9": "Monitor - Track progress and quality (Score: 1-100)"
    "5.10": "Validate - Verify against requirements (Score: 1-100)"
    "5.11": "Reflect - Analyze outcomes and process (Score: 1-100)"
    "5.12": "Document - Record decisions and findings (Score: 1-100)"
    "5.13": "Improve - Identify optimization opportunities (Score: 1-100)"
  scoring:
    range: "1-100 for each stage"
    purpose: "Quantify reasoning quality and identify improvement areas"
    tracking: "Score each stage to enable meta-analysis of workflow effectiveness"
  features:
    - "Numbered progression through 5.1-5.13"
    - "Metacognition scoring for each stage"
    - "Self-awareness and reflection built-in"
    - "Supports episodic workflows"
    - "Enables quantitative quality tracking"

# Planning Phases
planning_phases:
  phase_1:
    name: "Query Deconstruction"
    description: "Systematic breakdown and analysis of research query"
    scratchpad_stages:
      ["5.1 AttentionFocus", "5.2 GoalClarify", "5.3 ConstraintMap"]
    objectives:
      - "Understand query deeply"
      - "Identify core subjects"
      - "Define scope clearly"
      - "Score understanding quality"
    actions:
      - "Restate query (5.1)"
      - "Clarify objectives (5.2)"
      - "Map constraints (5.3)"
      - "Score each stage 1-100"
    verbalize: "Phase 1: Query Deconstruction (Stages 5.1-5.3)"
    checklist:
      - "Query restated with understanding score"
      - "Objectives clarified and scored"
      - "Constraints mapped with completeness score"
      - "Scope defined and validated"

  phase_2:
    name: "Source Analysis"
    description: "Comprehensive source review with synthesis planning"
    scratchpad_stages:
      ["5.4 ContextGather", "5.5 HypothesisGen", "5.6 PlanBuild"]
    objectives:
      - "Gather all relevant context"
      - "Generate synthesis hypotheses"
      - "Build integration plan"
      - "Score analysis quality"
    actions:
      - "Review each source systematically (5.4)"
      - "Generate integration approaches (5.5)"
      - "Build synthesis plan (5.6)"
      - "Score context quality and plan completeness"
    verbalize: "Phase 2: Source Analysis (Stages 5.4-5.6)"
    checklist:
      - "All sources reviewed with quality scores"
      - "Gaps identified and documented"
      - "Synthesis hypotheses generated and scored"
      - "Integration plan built and validated"

  phase_3:
    name: "Structure Design"
    description: "Detailed outline creation with risk assessment"
    scratchpad_stages: ["5.7 RiskAssess", "5.8 Execute"]
    objectives:
      - "Assess structural risks"
      - "Design comprehensive outline"
      - "Plan execution strategy"
      - "Score design quality"
    actions:
      - "Identify risks in structure (5.7)"
      - "Execute outline creation (5.8)"
      - "Propose title, sections, subsections"
      - "Score structural completeness"
    verbalize: "Phase 3: Structure Design (Stages 5.7-5.8)"
    checklist:
      - "Risks identified and scored"
      - "Title proposed and validated"
      - "Sections outlined (5+) with scores"
      - "Subsections planned in detail"
      - "Execution strategy confirmed"

  phase_4:
    name: "Validation & Optimization"
    description: "Final validation with reflection and improvement"
    scratchpad_stages:
      [
        "5.9 Monitor",
        "5.10 Validate",
        "5.11 Reflect",
        "5.12 Document",
        "5.13 Improve",
      ]
    objectives:
      - "Monitor plan quality"
      - "Validate against requirements"
      - "Reflect on process"
      - "Document decisions"
      - "Identify improvements"
    actions:
      - "Monitor plan completeness (5.9)"
      - "Validate against query (5.10)"
      - "Reflect on planning process (5.11)"
      - "Document all decisions (5.12)"
      - "Identify optimization opportunities (5.13)"
    verbalize: "Phase 4: Validation & Optimization (Stages 5.9-5.13)"
    checklist:
      - "Plan monitored with quality score"
      - "Validation completed with pass/fail"
      - "Reflection documented with insights"
      - "Decisions recorded systematically"
      - "Improvements identified and scored"

