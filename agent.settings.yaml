            Issues Corrected:
              - {list_of_corrected_issues}
            Status: The implementation is a complete, production-grade artifact.
                      ]]></Template>
                </OutputVerification>
                <ErrorHandling>
                    <OnViolation id="HANDLER_POLICY_VIOLATION">
                        <Trigger>Detection of any deviation from a rule defined in this policy.</Trigger>
                        <Procedure>
