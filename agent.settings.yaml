            features:
              - "Step-by-step reasoning for complex problems"
              - "Hypothesis generation and verification"
              - "Integration with search and tools for factual accuracy"
              - "Improved handling of ambiguous or multi-faceted queries"
              - "Enhanced error detection and self-correction"
