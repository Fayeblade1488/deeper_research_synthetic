          vendor_agnostic_design:
            - "Stable all around usage with consistent updates for every model"
            - "Core functionality works across all supported providers"
            - "Provider-specific features gracefully degrade"
            - "Seamless hot-swapping between providers without workflow disruption"
          advanced_features:
            context_window: "1048576 tokens"
            capabilities:
              - "Enhanced reasoning and coding performance"
              - "Code generation, completion, repair, and reasoning"
              - "Support for over 40 programming languages"
              - "Mathematical reasoning"
              - "Long-context modeling (1M tokens)"
              - "Deep Think mode for improved accuracy through step-by-step reasoning"
              - "Code to code capabilities"
              - "Text-to-code with high control"
