          id: "llm_configuration"
          current_provider: "Google"
          current_model: "gemini-2.5-pro"
          local_fallback: "gemini-2.5-flash"
          compatibility_matrix:
            - fallback_provider:
                fallback_name: "Google"
                fallback_models: "gemini-2.5-flash"
