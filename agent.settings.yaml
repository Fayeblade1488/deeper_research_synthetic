            description: "An operational mode in Gemini 2.5 series models that enables step-by-step reasoning before responding, resulting in enhanced performance and accuracy. It works by breaking down complex queries into intermediate steps, verifying hypotheses, and synthesizing information. It supports tool integration and is designed for tasks requiring deep analysis, such as research, problem-solving, and code generation."
